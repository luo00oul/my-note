site_name: 我的笔记站
site_description: CS 学习笔记
site_author: luo00oul

theme:
  name: material
  language: zh
  features:
    - navigation.instant        # 页面切换无刷新
    - navigation.tracking       # 目录跟随高亮
    - navigation.tabs           # 顶部导航
    - navigation.top            # 回到顶部按钮
    - toc.follow                # 右侧目录自动跟随
    - search.highlight
    - search.suggest
    - content.code.copy         # 代码一键复制
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

markdown_extensions:
  - admonition
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
site_name: 我的笔记站
site_author: luo00oul
copyright: © 2026 luo00oul
